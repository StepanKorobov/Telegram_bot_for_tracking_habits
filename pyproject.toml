[project]
name = "telegram-bot-for-tracking-habits"
version = "0.1.0"
description = "A service that allows users to effectively manage their habits through a Telegram bot."
authors = [
    {name = "Stepan",email = "stepa.korobov@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "envparse (>=0.2.0,<0.3.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
api = [
    "fastapi (>=0.138.0,<0.139.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)",
    "python-multipart (>=0.0.32,<0.0.33)"
]
bot = [
    "pytelegrambotapi (>=4.34.0,<5.0.0)"
]
scheduler = [
    "apscheduler (>=3.11.2,<4.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "pytelegrambotapi (>=4.34.0,<5.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)"
]
celery = [
    "pytelegrambotapi (>=4.34.0,<5.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "celery[redis] (==5.6.3)"
]
