version: '3.12'

services:
  redis:
    image: redis:7-alpine
    container_name: habit-redis
    ports:
      - "6379:6379"
    networks:
      - habit_network

  celery:
    container_name: celery
    build:
      context: .
      dockerfile: DockerfileCelery
    stop_signal: SIGTERM
    restart: always
    environment:
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    networks:
      - habit_network
    depends_on:
      - redis

  postgresql:
    container_name: postgresql
    image: postgres:latest
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=telegram
    ports:
      - "5432:5432"
    volumes:
      - ./db/:/var/lib/postgresql
    hostname: "database"
    networks:
      - habit_network

