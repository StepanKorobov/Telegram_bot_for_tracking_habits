  scheduler:
    container_name: scheduler
    build:
      context: .
      dockerfile: DockerfileScheduler
    volumes:
      - ./logs/:/scheduler/logs/
    stop_signal: SIGTERM
    restart: always
    environment:
      - TZ=${APP_TIMEZONE}
      - SERVICE_NAME=scheduler
    env_file:
      - .env
    networks:
      - habit_network

networks:
  habit_network:
    driver: bridge